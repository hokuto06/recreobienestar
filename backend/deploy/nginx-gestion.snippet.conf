# Insert this location block inside the EXISTING canonical-apex `server`
# block in nginx-flask-prod/nginx/conf.d/recreobienestar.conf (the one with
# `server_name recreobienestar.com;` and `root .../frontend-static/recreobienestar;`),
# placed BEFORE the existing `location / { try_files ... }` block.
#
# Do not create a new server{} block and do not touch server_name, root,
# ssl_certificate, or the existing `location /` — this only adds one new
# prefix location so nginx routes /gestion/* to the Django admin container
# and leaves the static site's routing untouched.
#
# recreo-django must be reachable from nginx-proxy — it is, because both
# are attached to the nginx-flask-prod_default network (see
# backend/docker-compose.yml). No new nginx volume mount is needed: static
# and media are served by WhiteNoise from inside the Django container under
# the same /gestion/ prefix.

    location /gestion/ {
        proxy_pass http://recreo-django:8100/gestion/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 20M;
    }

    # Read-only public API (categories/programs/videos/plans).
    location /api/ {
        proxy_pass http://recreo-django:8100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
