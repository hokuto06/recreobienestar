{% extends "base.html" %}
{% block title %}Página no encontrada | Recreo Bienestar{% endblock %}
{% block content %}
<section class="container video-locked-page">
  <span class="eyebrow">Error 404</span>
  <h1>No encontramos esta página</h1>

</section>
{% endblock %}
