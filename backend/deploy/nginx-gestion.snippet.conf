# Insert these location blocks inside the EXISTING canonical-apex `server`
# block in nginx-flask-prod/nginx/conf.d/recreobienestar.conf (the one with
# `server_name recreobienestar.com;` and `root .../frontend-static/recreobienestar;`),
# placed BEFORE the existing `location / { try_files ... }` block.
#
# Do not create a new server{} block and do not touch server_name, root,
# ssl_certificate, or the existing `location /` — this only adds new
# prefix locations so nginx routes specific paths to the Django container
# and leaves everything else (the static landing page) untouched.
#
# STILL BLOCKED as of Phase 2b: nginx -t fails on the existing, unrelated
# nginx/default.conf (estebanmartins.com.ar), which references the
# intentionally-stopped `blog-front` upstream. See
# deploy/PHASE2B_DELIVERABLES.md §12 for the full explanation — this file
# is kept up to date and ready to apply the moment that's resolved.
#
# recreo-django must be reachable from nginx-proxy — it is, because both
# are attached to the nginx-flask-prod_default network (see
# backend/docker-compose.yml). No new nginx volume mount is needed: static
# and media are served by WhiteNoise from inside the Django container.

    # ── Django Admin (Carla) ──────────────────────────────────────────
    location /gestion/ {
        proxy_pass http://recreo-django:8100/gestion/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 20M;
    }

    # ── Read-only public API (categories/programs/videos/plans) ───────
    location /api/ {
        proxy_pass http://recreo-django:8100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Public member auth + dashboard + video library (Phase 2b) ─────
    # Explicit prefixes, not a catch-all — everything NOT listed here
    # keeps falling through to the static site's `location /` below.
    location ~ ^/(registro|ingresar|salir|recuperar-clave|mi-cuenta|videoteca|videos)/ {
        proxy_pass http://recreo-django:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Static/media for the Django-rendered pages above ──────────────
    # (Separate from the static SITE's own assets under frontend-static/,
    # which the existing location blocks below already serve directly.)
    #
    # `^~` is required here: without it, nginx would still fall through to
    # the existing `location ~* \.(css|js|svg|...)$` regex block below
    # (regex locations are checked even after a plain-prefix match unless
    # told to stop), which would try to serve e.g. /static/site/css/
    # style.css from the STATIC SITE's own filesystem root and 404 — never
    # reaching recreo-django at all. `^~` stops that fallthrough.
    location ^~ /static/ {
        proxy_pass http://recreo-django:8100/static/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /media/ {
        proxy_pass http://recreo-django:8100/media/;
        proxy_set_header Host $host;
    }
