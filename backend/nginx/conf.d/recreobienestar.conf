#########################################
# recreobienestar.com — Recreo Bienestar, fully isolated stack
# Cert source: /etc/letsencrypt/live/recreobienestar.com/
#   (mounted read-only from the existing, still-authoritative Let's
#   Encrypt config dir — see docker-compose.yml header comment and
#   ARCHITECTURE.md for the renewal flow)
# Issued: 2026-08-05  Expires: 2026-11-03
#########################################

# ── Stage A hardening: rate-limit zones (SECURITY_AUDIT.md HIGH-1) ────────
# Declared here, at the file's top level, which nginx includes inside the
# http{} block of the main nginx.conf — this is the only valid context for
# limit_req_zone. Small zone sizes (2m ≈ 32k tracked IPs each) deliberately
# kept minimal given this box's tight memory budget; both are already far
# larger than this site's real traffic needs.
limit_req_zone $binary_remote_addr zone=login_zone:2m rate=5r/m;
limit_req_zone $binary_remote_addr zone=pwreset_zone:2m rate=3r/m;
limit_req_status 429;

# ── HTTP: ACME challenge + redirect to HTTPS ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name recreobienestar.com www.recreobienestar.com;

    # Let's Encrypt webroot challenge (required for cert renewal) — served
    # from the same shared webroot the existing renewal command targets.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://recreobienestar.com$request_uri;
    }
}

# ── HTTPS: www → apex redirect ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.recreobienestar.com;

    ssl_certificate     /etc/letsencrypt/live/recreobienestar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recreobienestar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    return 301 https://recreobienestar.com$request_uri;
}

# ── HTTPS: canonical apex ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name recreobienestar.com;

    ssl_certificate     /etc/letsencrypt/live/recreobienestar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recreobienestar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/recreobienestar.access.log;
    error_log  /var/log/nginx/recreobienestar.error.log;

    # Full security headers — HSTS active. Covers `/` and any other
    # location below that does NOT declare its own add_header (nginx's
    # add_header does not inherit into a location that sets its own — see
    # the Stage A fix note further down for how every other location
    # compensates for this).
    include /etc/nginx/snippets/seguridad.conf;

    # Stage A fix (SECURITY_AUDIT.md MEDIUM-2/3): Django's own
    # SecurityMiddleware sets its own X-Frame-Options/Referrer-Policy/HSTS/
    # nosniff on every response it produces. Left alone, proxied locations
    # end up with TWO copies of each (nginx's + Django's) with different
    # values — fragile, and not guaranteed to resolve the same way across
    # every header/client. proxy_hide_header strips Django's copies before
    # nginx's own (from seguridad.conf, included in every location below)
    # get added, so there is exactly one source of truth for these headers
    # everywhere. Unlike add_header, proxy_hide_header set here at server
    # level DOES inherit normally into every child location.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    # Same fix, same reason, caught during Stage A live validation: Django
    # (e.g. the admin login view, and MemberLoginView via
    # django.utils.cache) sets its own Cache-Control on several of these
    # pages too. Every location below that cares about caching already
    # sets its own explicit Cache-Control (no-store for auth pages,
    # public/immutable for static/media) — hide Django's copy everywhere
    # so those are always the single source of truth, exactly like the
    # four headers above.
    proxy_hide_header Cache-Control;

    # Reasonable upload limit for admin-side media/image uploads.
    client_max_body_size 20M;

    # Docker's embedded DNS. Combined with the $django_upstream variable
    # below, this makes proxy_pass resolve "recreo-django" at REQUEST
    # TIME instead of at config-load/reload time — nginx starts and
    # reloads successfully even if recreo-django is briefly down (e.g.
    # mid-deploy), returning 502 for actual requests during that window
    # instead of refusing to start at all. This is deliberately NOT how
    # nginx-flask-prod's default.conf is written, which is exactly why
    # that file blocks reloads while blog-front is stopped — see
    # ARCHITECTURE.md for the full story. Built resiliently here from
    # day one rather than repeating that mistake.
    #
    # IMPORTANT: every proxy_pass below deliberately has NO trailing path
    # after $django_upstream. When proxy_pass targets a variable, nginx
    # does NOT do prefix substitution (the normal "replace the matched
    # location prefix with the proxy_pass URI" behavior) — it uses
    # whatever literal path follows the variable as a fixed, exact target,
    # discarding the rest of the real request URI. Discovered exactly this
    # way during pre-cutover testing: /static/<file> was silently
    # collapsing to a bare /static/ on every request. Since Django's own
    # URL patterns already expect the full original path unchanged
    # everywhere in this app (ADMIN_URL, /api/, /static/, /media/, the
    # accounts/catalog routes), the fix is simply to pass the request
    # through as-is — never add a path after $django_upstream here.
    resolver 127.0.0.11 valid=10s;
    set $django_upstream recreo-django:8100;

    # ── Stage A hardening: brute-force-sensitive endpoints ─────────────
    # Exact-match locations, so they take precedence over the broader
    # prefix/regex locations below for these three specific paths only —
    # everything else about their behavior (proxy target, headers) is
    # identical to their normal location, just with limit_req added.
    # django-axes (config/settings.py) is the complementary, smarter
    # per-account layer behind these — this is the coarse, fast,
    # connection-level first line of defense.
    location = /ingresar/ {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /gestion/login/ {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /recuperar-clave/ {
        limit_req zone=pwreset_zone burst=2 nodelay;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Django Admin (Carla's content management) ────────────────────
    location /gestion/ {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Read-only public API (categories/programs/videos/plans) ───────
    # No competing add_header here, so seguridad.conf's server-level
    # include (above) already applies — nothing extra needed.
    location /api/ {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Public member auth + dashboard + video library ────────────────
    # Explicit prefixes, not a catch-all — everything NOT listed here
    # falls through to the static site's `location /` below. /ingresar/
    # and /recuperar-clave/ are matched by their own exact-match location
    # above instead (rate-limited); this regex still covers their other
    # sub-paths (e.g. /recuperar-clave/confirmar/..., /videos/<slug>/).
    location ~ ^/(registro|ingresar|salir|recuperar-clave|mi-cuenta|videoteca|videos)/ {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Static/media for the Django-rendered pages above ──────────────
    # `^~` stops nginx falling through to the `\.(css|js|...)$` regex
    # block below, which would otherwise try (and fail) to serve these
    # from the static SITE's filesystem root instead of recreo-django.
    location ^~ /static/ {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this, Django can't tell the request arrived over HTTPS
        # (SECURE_PROXY_SSL_HEADER has nothing to match), so
        # SECURE_SSL_REDIRECT fires and self-redirects every static asset
        # request — caught during pre-cutover testing.
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/seguridad.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /media/ {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/seguridad.conf;
    }

    # ── Static marketing site (unchanged content, unchanged behavior) ─
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }

    location = /sitemap.xml {
        access_log off;
    }
}
